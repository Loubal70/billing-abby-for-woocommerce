name: Testing

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHP_CodeSniffer
        run: composer phpcs

  phpunit:
    name: Unit tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.4']
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Install Subversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Set up the WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 latest true

      - name: Run tests
        run: composer test

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          categories: plugin_repo,security
          exclude-directories: |
            tests
            bin
            .github
            .claude
          exclude-files: |
            .phpcs.xml.dist
            .editorconfig
            .gitignore
            .distignore
            phpunit.xml.dist
            CLAUDE.md
            ROADMAP.md
            README.md
