name: Testing

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHP_CodeSniffer
        run: composer phpcs

  phpunit:
    name: Unit tests (PHP ${{ matrix.php-version }}, ${{ matrix.tax-base }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.4']
        # WC_TAX_ROUNDING_MODE is frozen at boot from the tax base, so each base runs in its own pass.
        tax-base: ['exclusive', 'inclusive']
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Install Subversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Set up the WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 latest true

      - name: Install WooCommerce (hard dependency, loaded by the test bootstrap)
        run: |
          curl -sL https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip -o "${{ runner.temp }}/woocommerce.zip"
          unzip -q "${{ runner.temp }}/woocommerce.zip" -d "${{ runner.temp }}"
          echo "WC_PLUGIN_PATH=${{ runner.temp }}/woocommerce/woocommerce.php" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          BAFW_PRICES_INCLUDE_TAX: ${{ matrix.tax-base == 'inclusive' && '1' || '' }}
        run: composer test

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out source code
        uses: actions/checkout@v5
        with:
          path: billing-abby-for-woocommerce

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: wp-cli

      # The wp-env based plugin-check-action proved unreliable on the runners
      # (Docker "Environment not initialized"), so Plugin Check runs directly
      # through wp-cli here, mirroring the local `composer plugin-check`.
      - name: Set up WordPress
        run: |
          wp core download --path=wp
          wp config create --path=wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path=wp --url=http://localhost --title="Test" \
            --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          wp plugin install plugin-check --activate --path=wp
          cp -r billing-abby-for-woocommerce wp/wp-content/plugins/billing-abby-for-woocommerce

      - name: Run Plugin Check
        run: |
          wp plugin check billing-abby-for-woocommerce --path=wp \
            --categories=plugin_repo,security \
            --exclude-directories=tests,bin,.github,.claude \
            --exclude-files=.phpcs.xml.dist,.editorconfig,.gitignore,.distignore,phpunit.xml.dist,CLAUDE.md,ROADMAP.md,README.md

  assets:
    name: JS assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Build assets
        run: npm run build

      - name: Ensure committed build/ is up to date
        run: |
          if [ -n "$(git status --porcelain build/)" ]; then
            echo "::error::build/ is out of date — run 'npm run build' and commit the result."
            git status --porcelain build/
            exit 1
          fi
